    />
    <meta name="twitter:card" content="summary_large_image" />

      content="I build APIs, web apps and systems that run in production. React, Node.js, TypeScript and PostgreSQL."

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <style>
      html {
        background: #09090b;
        color: #fafafa;
        color-scheme: dark;
      }
      body {
        margin: 0;
      }
      .splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .splash-name {
        font:
          15px ui-monospace,
          Consolas,
          monospace;
        color: #10b981;
      }
      .splash-bar {
        width: 120px;
        height: 2px;
        border-radius: 2px;
        background: #27272a;
        overflow: hidden;
      }
      .splash-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #10b981;
        animation: splash 1s ease-in-out infinite;
      }
      @keyframes splash {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
    <title>Yousef Emad — Full Stack Developer</title>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Loading">
        <span class="splash-name">yousef.dev</span>
        <span class="splash-bar"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
